<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<title>ضبط صدا</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface-alt:#F0EEE6;
    --text:#141413; --text-2:#6C6B68; --text-3:#8F8E8A;
    --line:#E5E3DA; --line-2:#D6D3C7;
    --accent:#D97757; --accent-deep:#B85C3E; --en:#3B4A6B;
    --ok:#3E7B5A; --ok-bg:#EAF3EE; --warn:#B9791F; --warn-bg:#FBF1E2;
    --fa:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fa);font-size:15px;line-height:1.8}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .sub{color:var(--text-3);font-size:.82rem}
  .grow{flex:1}

  /* ── bar ─────────────────────────────── */
  #bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.55rem;
    padding:calc(.5rem + env(safe-area-inset-top)) .8rem .5rem;
    background:rgba(250,249,245,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  #bar b{font-size:.98rem}
  .ic{min-width:38px;height:38px;display:grid;place-items:center;background:none;border:1px solid transparent;
    border-radius:9px;text-decoration:none;color:var(--text);font-size:1rem}
  .ic:hover{background:var(--surface-alt)}
  #menuBtn{display:none}
  .pcount{color:var(--text-2);font-size:.84rem;font-variant-numeric:tabular-nums}
  #allBtn{font-size:.9rem}

  /* ── layout ──────────────────────────── */
  #app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;
    max-width:1180px;margin:0 auto;padding:14px .8rem calc(2rem + env(safe-area-inset-bottom))}
  #side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.5rem;
    max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:64px}
  #sideHead{display:flex;justify-content:space-between;align-items:baseline;padding:.35rem .5rem .5rem;
    font-size:.8rem;color:var(--text-3)}
  .grp{border-top:1px solid var(--line);padding:.25rem 0}
  .grp:first-child{border-top:0}
  .grp summary{display:flex;gap:.4rem;align-items:center;justify-content:space-between;cursor:pointer;
    padding:.5rem;font-size:.86rem;font-weight:600;border-radius:8px;list-style:none}
  .grp summary::-webkit-details-marker{display:none}
  .grp summary::before{content:"‹";color:var(--text-3);font-size:1rem;transition:transform .15s;display:inline-block}
  .grp[open] summary::before{transform:rotate(-90deg)}
  .grp summary:hover{background:var(--surface-alt)}
  .ex{display:flex;gap:.4rem;align-items:baseline;justify-content:space-between;width:100%;
    text-align:right;background:none;border:0;border-radius:8px;padding:.38rem .55rem;font-size:.82rem;
    color:var(--text-2);line-height:1.55}
  .ex .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ex .n{flex:none;font-size:.72rem;color:var(--text-3);font-variant-numeric:tabular-nums}
  .ex.has .n{color:var(--ok)}
  .ex:hover{background:var(--surface-alt);color:var(--text)}
  .ex.on{background:#F6EDE9;color:var(--accent-deep);font-weight:600}
  .ex.on .n{color:var(--accent-deep)}

  main{min-width:0}
  #empty{margin:4rem 1rem;text-align:center;color:var(--text-3)}

  /* ── card ────────────────────────────── */
  #card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.15rem 1.25rem}
  .head{display:flex;gap:.8rem;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem}
  .ttl{font-size:.92rem;font-weight:700;line-height:1.5}
  .count{flex:none;font-size:.82rem;color:var(--text-3);font-variant-numeric:tabular-nums}
  .fa{font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.95;font-weight:500;
    margin:.7rem 0 1rem;min-height:3.6em}
  .en{direction:ltr;text-align:left;font-family:var(--serif);color:var(--text-2);
    font-size:.95rem;line-height:1.6;margin:-.4rem 0 1rem;padding:.5rem .65rem;
    background:var(--bg);border-radius:8px}
  .en[hidden]{display:none}

  .wavebox{position:relative;margin:.2rem 0 .7rem}
  #wave{display:block;width:100%;height:74px;border-radius:10px;background:var(--bg)}
  .meter{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:.35rem}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s linear}
  .meter i.hot{background:var(--accent-deep)}

  .row{display:flex;align-items:center;gap:.9rem;margin-top:.5rem}
  .rec{width:70px;height:70px;flex:none;border-radius:50%;border:0;background:var(--accent);
    color:#fff;font-size:1.5rem;display:grid;place-items:center;box-shadow:0 3px 12px rgba(217,119,87,.32);
    transition:transform .12s ease,background .15s ease}
  .rec:hover{background:var(--accent-deep)}
  .rec:active{transform:scale(.96)}
  .rec[disabled]{opacity:.45;box-shadow:none;cursor:default}
  body.rec .rec{background:var(--accent-deep);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,92,62,.38)}50%{box-shadow:0 0 0 14px rgba(184,92,62,0)}}
  .clock{font-family:var(--serif);font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:4.2em}
  .hint{color:var(--text-3);font-size:.82rem;line-height:1.6}
  body.rec .hint{color:var(--accent-deep);font-weight:600}

  .row2{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-top:.9rem;
    padding-top:.85rem;border-top:1px solid var(--line)}
  .row2 button{background:var(--surface-alt);border:1px solid var(--line);border-radius:9px;
    padding:.42rem .7rem;font-size:.82rem}
  .row2 button:hover{background:#E9E6DC}
  .row2 button[disabled]{opacity:.4;cursor:default}
  .chk{display:flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--text-2);margin-inline-start:auto}
  .chk input{width:16px;height:16px;accent-color:var(--accent)}

  .status{min-height:1.4em;margin-top:.55rem;font-size:.82rem;color:var(--ok)}
  .status.err{color:var(--accent-deep)}
  #takeInfo{margin-top:.25rem;font-size:.78rem}

  .chips{display:flex;flex-wrap:wrap;gap:.32rem;margin:1rem .1rem}
  .chip{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    font-size:.74rem;color:var(--text-2);display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .chip:hover{border-color:var(--line-2);background:var(--surface-alt)}
  .chip.done{background:var(--ok-bg);border-color:#CBE2D4;color:var(--ok)}
  .chip.pending{background:var(--warn-bg);border-color:#EBD3AA;color:var(--warn)}
  .chip.flag{border-style:dashed;border-color:var(--warn);color:var(--warn)}
  .chip.cur{outline:2px solid var(--accent);outline-offset:1px}

  .cfg{margin-top:1.2rem;border-top:1px solid var(--line);padding-top:.8rem;
    display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center;font-size:.8rem;color:var(--text-2)}
  .cfg label{display:flex;gap:.35rem;align-items:center}
  .cfg select,.cfg input[type=range]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:.2rem .3rem;font-size:.8rem}
  .cfg input[type=range]{padding:0;width:110px}
  .cfg button{background:none;border:1px solid var(--line);border-radius:7px;padding:.25rem .55rem;font-size:.78rem}
  .foot{margin:1rem .1rem;color:var(--text-3);font-size:.75rem;line-height:1.7}
  @media (pointer:coarse){ .keys{display:none} }

  #backdrop{position:fixed;inset:0;background:rgba(20,20,19,.32);z-index:24;display:none}
  body.side-open #backdrop{display:block}

  @media (max-width:820px){
    #menuBtn{display:grid}
    #app{grid-template-columns:1fr;padding:.6rem .55rem 2rem}
    #side{position:fixed;inset:0 0 0 auto;width:min(86vw,330px);max-height:none;z-index:25;
      border-radius:0;border:0;transform:translateX(105%);transition:transform .22s ease;
      padding-top:calc(.6rem + env(safe-area-inset-top))}
    body.side-open #side{transform:none}
    #card{padding:.9rem .8rem 1rem}
    .fa{min-height:2.4em}
    .rec{width:64px;height:64px}
    .clock{font-size:1.3rem}
    .chk{margin-inline-start:0}
  }
  @media (prefers-reduced-motion:reduce){body.rec .rec{animation:none}}
</style>
</head>
<body>
<header id="bar">
  <button id="menuBtn" class="ic" title="تمرین‌ها">☰</button>
  <b>ضبط صدا</b>
  <span id="progTop" class="pcount"></span>
  <span class="grow"></span>
  <button id="allBtn" class="ic" title="شنیدن همهٔ ضبط‌های این تمرین">▶ همه</button>
  <a class="ic" href="index.html" title="برگشت به تمرین‌ها">↗</a>
</header>

<div id="backdrop"></div>
<div id="app">
  <aside id="side" dir="rtl">
    <div id="sideHead"><span>تمرین‌ها</span><span id="sideTotal"></span></div>
    <div id="groups"></div>
  </aside>

  <main>
    <div id="empty" class="empty">یک تمرین از فهرست انتخاب کن.</div>

    <section id="card" hidden>
      <div class="head">
        <div><div id="exTitle" class="ttl"></div><div id="exSub" class="sub"></div></div>
        <div id="counter" class="count"></div>
      </div>

      <div id="fa" class="fa"></div>
      <div id="en" class="en" hidden></div>

      <div class="wavebox">
        <canvas id="wave" width="900" height="74"></canvas>
        <div class="meter"><i id="meter"></i></div>
      </div>

      <div class="row">
        <button id="recBtn" class="rec" title="ضبط / پایان (Space)">●</button>
        <div class="clock" id="clock">۰:۰۰</div>
        <div class="hint" id="hint">Space را بزن و جمله را بخوان</div>
      </div>

      <div class="row2">
        <button id="playBtn" title="شنیدن این جمله (P)">🔊 شنیدن</button>
        <button id="redoBtn" title="ضبط دوباره (R)">↺ دوباره</button>
        <button id="skipBtn" title="رد کردن (S)">رد کردن</button>
        <label class="chk"><input id="autoPlay" type="checkbox"> پخش خودکار</label>
        <label class="chk"><input id="enChk" type="checkbox"> انگلیسی</label>
      </div>

      <div id="status" class="status" role="status"></div>
      <div id="takeInfo" class="sub"></div>

      <div class="cfg">
        <label>قطع خودکار
          <select id="silence">
            <option value="700">۰٫۷ ثانیه</option>
            <option value="1000">۱ ثانیه</option>
            <option value="1500">۱٫۵ ثانیه</option>
          </select>
        </label>
        <label>حساسیت
          <input id="threshold" type="range" min="-58" max="-28" step="1">
          <span id="thVal" class="sub"></span>
        </label>
        <label>میکروفون <select id="micSel"><option value="">پیش‌فرض</option></select></label>
        <button id="calibBtn" type="button">کالیبراسیون</button>
      </div>

      <div id="chips" class="chips" aria-label="جمله‌ها"></div>
      <div class="foot">
        <span class="keys">Space ضبط/پایان · R دوباره · P شنیدن · S رد · ← → جملهٔ قبل/بعد · F علامت‌گذاری برای بعد · </span>
        <span id="where"></span>
      </div>
    </section>

  </main>
</div>

<script>
"use strict";
/* ─────────────────────────────────────────────────────────────────────────────
   Recorder for the Persian sentence of every exercise. One take → one small
   m4a on the server (`audio/<collection>/<exercise>/<sha1(fa)>.m4a`), named by
   the Persian text so a reordered exercise never mismatches a voice.
   The drill plays it; nothing here touches data/.
   ───────────────────────────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
const store = {
  get(k, d) { try { const v = localStorage.getItem("rec." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("rec." + k, JSON.stringify(v)); } catch {} },
};
const faNum = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const fmt = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };  // Latin: ۰ is a dot
const TOUCH = matchMedia("(pointer: coarse)").matches;
const HINT_IDLE = TOUCH ? "دکمهٔ قرمز را بزن و جمله را بخوان" : "Space را بزن و جمله را بخوان";
const HINT_REC = TOUCH ? "در حال ضبط… برای پایان بزن" : "در حال ضبط… برای پایان Space";
const size = (b) => b < 1024 ? faNum(b) + " بایت" : faNum(Math.round(b / 1024)) + " کیلوبایت";
const plain = (s) => String(s).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const attr = (s) => String(s).replace(/["\\]/g, "");

const CFG = {
  silence: store.get("silence", 1000),
  threshold: store.get("threshold", -42),
  autoplay: store.get("autoplay", false),
  showEn: store.get("showEn", false),
  mic: store.get("mic", ""),
};

let GROUPS = [], FLAT = [], COUNTS = {};
let path = "", DATA = null, ITEMS = [], CLIPS = {}, DONE = new Set(), PENDING = new Set(), FLAGS = new Set(), cur = 0;

/* mic / recorder */
let stream = null, ac = null, analyser = null, buf = null;
let mr = null, chunks = [], recStart = 0, raf = 0, spoke = false, silentAt = 0;
let levels = [], lastLevelAt = 0;
let take = null, recTarget = null, playEl = null, playToken = 0, advTimer = 0, statusTimer = 0;

/* ── tiny IndexedDB queue: a take is safe on the device before it is uploaded ── */
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("rec-takes", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("takes");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("takes", mode);
    const q = fn(t.objectStore("takes"));
    t.oncomplete = () => res(q ? q.result : undefined);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const idbPut = (k, v) => idb("readwrite", (s) => s.put(v, k));
const idbGet = (k) => idb("readonly", (s) => s.get(k));
const idbDel = (k) => idb("readwrite", (s) => s.delete(k));
const idbKeys = () => idb("readonly", (s) => s.getAllKeys());

async function sha1(s) {
  const b = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].slice(0, 6).map((x) => x.toString(16).padStart(2, "0")).join("");
}

/* ── start ─────────────────────────────────────────────────────────────── */
(async function init() {
  $("#enChk").checked = !!CFG.showEn;
  $("#autoPlay").checked = !!CFG.autoplay;
  $("#silence").value = String(CFG.silence);
  $("#threshold").value = String(CFG.threshold);
  $("#thVal").textContent = faNum(CFG.threshold) + " dB";
  $("#where").textContent = " · ذخیره در " + location.hostname;
  bind();

  if (!window.crypto?.subtle) status("این صفحه باید با https یا localhost باز شود تا بتواند ضبط کند.", true);
  try {
    GROUPS = await fetch("../data/index.json").then((r) => r.json());
  } catch { status("فهرست تمرین‌ها نیامد.", true); return; }
  FLAT = GROUPS.flatMap((g) => g.items.map((it) => ({ ...it, group: g.id, groupTitle: g.title })));
  renderGroups();
  refreshCounts();
  retryPending();

  const q = new URLSearchParams(location.search).get("d");
  const last = store.get("last", "");
  const pick = q && FLAT.some((x) => x.id === q) ? q
    : last && FLAT.some((x) => x.id === last) ? last : FLAT[0]?.id;
  if (pick) select(pick);
  navigator.storage?.persist?.().catch(() => {});
})();

/* ── sidebar ───────────────────────────────────────────────────────────── */
function renderGroups() {
  $("#groups").innerHTML = GROUPS.map((g) => `
    <details class="grp" data-g="${esc(g.id)}"${g.id === (path || "").split("/")[0] ? " open" : ""}>
      <summary><span>${esc(g.title)}</span><b class="sub" data-gp="${esc(g.id)}"></b></summary>
      ${g.items.map((it) => `
        <button class="ex${it.id === path ? " on" : ""}" type="button" data-id="${esc(it.id)}">
          <span class="t">${esc(it.title)}</span><span class="n" data-n="${esc(it.id)}"></span>
        </button>`).join("")}
    </details>`).join("");
}

function updateCounts() {
  for (const g of GROUPS) {
    let done = 0, all = 0;
    for (const it of g.items) {
      const n = Math.min(COUNTS[it.id] || 0, it.units);
      all += it.units; done += n;
      const row = document.querySelector(`[data-n="${attr(it.id)}"]`);
      if (row) {
        row.textContent = n ? `${faNum(n)} از ${faNum(it.units)}` : "";
        row.closest(".ex")?.classList.toggle("has", n > 0);
      }
    }
    const gp = document.querySelector(`[data-gp="${attr(g.id)}"]`);
    if (gp) gp.textContent = `${faNum(done)} از ${faNum(all)}`;
  }
}

async function refreshCounts() {
  try {
    const j = await fetch("../api/audio").then((r) => r.json());
    COUNTS = j.counts || {};
    const total = Object.values(COUNTS).reduce((a, b) => a + b, 0);
    $("#sideTotal").textContent = total ? `${faNum(total)} جمله` : "";
    updateCounts();
  } catch {}
}

function openSide(on) {
  document.body.classList.toggle("side-open", on);
}

/* ── one exercise ──────────────────────────────────────────────────────── */
async function select(id) {
  stopPlay();
  clearTimeout(advTimer);
  if (mr) stopRec();
  path = id;
  store.set("last", id);
  openSide(false);
  const meta = FLAT.find((x) => x.id === id);
  $("#exTitle").textContent = meta?.title || id;
  $("#exSub").textContent = meta?.groupTitle || "";
  $("#empty").hidden = true;
  $("#card").hidden = false;
  $("#fa").textContent = "…";
  $("#en").textContent = "";
  $("#status").textContent = "";
  $("#takeInfo").textContent = "";
  document.querySelectorAll(".ex.on").forEach((e) => e.classList.remove("on"));
  document.querySelector(`.ex[data-id="${attr(id)}"]`)?.classList.add("on");
  document.querySelector(`details[data-g="${attr((meta?.group) || "")}"]`)?.setAttribute("open", "");

  try {
    const text = await fetch("../data/" + id + ".js").then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    });
    DATA = JSON.parse(text.slice(text.indexOf("(") + 1, text.lastIndexOf(")")));
  } catch { status("فایل این تمرین خوانده نشد.", true); return; }

  if (!window.crypto?.subtle) { ITEMS = []; status("ضبط ممکن نیست: صفحه را با https باز کن.", true); return; }
  ITEMS = (DATA.items || []).map((it, i) => ({ i, fa: it.fa || "", en: it.en || "", hash: "" }));
  for (const it of ITEMS) it.hash = await sha1(it.fa);
  try {
    const j = await fetch("../api/audio?d=" + enc(id)).then((r) => r.json());
    CLIPS = j.clips || {};
  } catch { CLIPS = {}; }
  DONE = new Set(Object.keys(CLIPS));
  PENDING = new Set();
  try {                                  // takes recorded offline, still on this device
    for (const k of await idbKeys()) {
      const j = k.lastIndexOf("/");
      if (k.slice(0, j) === id && !DONE.has(k.slice(j + 1))) { DONE.add(k.slice(j + 1)); PENDING.add(k.slice(j + 1)); }
    }
  } catch {}
  FLAGS = new Set(store.get("flags." + id, []));
  const saved = store.get("at." + id, -1);
  cur = Number.isInteger(saved) && saved >= 0 && saved < ITEMS.length && !DONE.has(ITEMS[saved].hash)
    ? saved : Math.max(0, firstOpen());
  renderChips();
  go(cur);
  idle();
}

const firstOpen = () => { for (let k = 0; k < ITEMS.length; k++) if (!DONE.has(ITEMS[k].hash)) return k; return 0; };
const recorded = () => ITEMS.reduce((n, it) => n + (DONE.has(it.hash) ? 1 : 0), 0);

function go(i, keepStatus) {
  if (!ITEMS.length) return;
  cur = (i + ITEMS.length) % ITEMS.length;
  store.set("at." + path, cur);
  const it = ITEMS[cur];
  $("#fa").textContent = plain(it.fa);
  $("#en").textContent = plain(it.en);
  $("#en").hidden = !CFG.showEn;
  $("#counter").textContent = `${faNum(cur + 1)} از ${faNum(ITEMS.length)}`;
  $("#progTop").textContent = `${faNum(recorded())} از ${faNum(ITEMS.length)}`;
  const done = DONE.has(it.hash);
  $("#takeInfo").textContent = done ? "این جمله ضبط شده — R برای جایگزینی" : "";
  $("#playBtn").disabled = !done;
  $("#clock").textContent = "۰:۰۰";
  $("#hint").textContent = done ? (TOUCH ? "دوباره را بزن تا جایگزین شود" : "R برای ضبط دوباره · Space برای همین جمله") : HINT_IDLE;
  if (!keepStatus) $("#status").textContent = "";
  levels = []; drawWave(); paintChips();
}

function nextIndex(from) {
  for (let k = 0; k < ITEMS.length; k++) {
    const i = (from + k) % ITEMS.length;
    if (!DONE.has(ITEMS[i].hash)) return i;
  }
  return -1;
}

function advance() {
  const n = nextIndex(cur + 1);
  if (n < 0) { status("این تمرین کامل شد ✓"); return; }
  go(n);
}

/* ── chips ─────────────────────────────────────────────────────────────── */
function renderChips() {
  $("#chips").innerHTML = ITEMS.map((it, i) =>
    `<button class="chip" type="button" data-i="${i}" title="${esc(plain(it.fa).slice(0, 90))}">${faNum(i + 1)}</button>`
  ).join("");
  paintChips();
}

function paintChips() {
  $("#chips").querySelectorAll(".chip").forEach((b) => {
    const i = +b.dataset.i, it = ITEMS[i];
    b.className = "chip" + (DONE.has(it.hash) ? " done" : "") + (PENDING.has(it.hash) ? " pending" : "")
      + (FLAGS.has(it.hash) ? " flag" : "") + (i === cur ? " cur" : "");
  });
  if (ITEMS.length) $("#progTop").textContent = `${faNum(recorded())} از ${faNum(ITEMS.length)}`;
}

/* ── microphone ────────────────────────────────────────────────────────── */
const mime = () => {
  const list = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/ogg;codecs=opus"];
  return list.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
};

async function ensureMic() {
  if (stream && stream.active) return;
  const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 };
  if (CFG.mic) audio.deviceId = { exact: CFG.mic };
  stream = await navigator.mediaDevices.getUserMedia({ audio });
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") await ac.resume();
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.2;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  fillMics();
}

function closeMic() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = analyser = buf = null;
}

async function fillMics() {
  if (!navigator.mediaDevices?.enumerateDevices) return;
  const ds = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
  $("#micSel").innerHTML = `<option value="">پیش‌فرض</option>` +
    ds.map((d) => `<option value="${esc(d.deviceId)}">${esc(d.label || "میکروفون")}</option>`).join("");
  $("#micSel").value = CFG.mic && ds.some((d) => d.deviceId === CFG.mic) ? CFG.mic : "";
}

const micError = (e) => e?.name === "NotAllowedError" ? "اجازهٔ میکروفون داده نشد: در نوار آدرس اجازه بده و دوباره امتحان کن."
  : e?.name === "NotFoundError" ? "میکروفونی پیدا نشد."
  : e?.name === "NotReadableError" ? "میکروفون در اختیار برنامهٔ دیگری است."
  : "میکروفون باز نشد: " + (e?.message || e);

/* ── record ────────────────────────────────────────────────────────────── */
async function startRec() {
  if (mr) return;
  if (!window.MediaRecorder) { status("این مرورگر ضبط صدا را پشتیبانی نمی‌کند.", true); return; }
  if (!window.crypto?.subtle) { status("ضبط فقط با https یا localhost کار می‌کند.", true); return; }
  if (!ITEMS.length) return;
  clearTimeout(advTimer);
  stopPlay();
  if (take?.url) { URL.revokeObjectURL(take.url); take = null; }
  $("#status").textContent = "";
  try { await ensureMic(); } catch (e) { status(micError(e), true); return; }
  recTarget = { hash: ITEMS[cur].hash, path, i: cur };

  const m = mime();
  try { mr = new MediaRecorder(stream, m ? { mimeType: m, audioBitsPerSecond: 96000 } : {}); }
  catch { try { mr = new MediaRecorder(stream); } catch { status("ضبط شروع نشد.", true); return; } }
  chunks = []; take = null; levels = []; spoke = false; silentAt = 0; lastLevelAt = 0;
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = finishRec;
  mr.start(250);
  recStart = performance.now();
  document.body.classList.add("rec");
  $("#recBtn").textContent = "■";
  $("#hint").textContent = HINT_REC;
  $("#clock").textContent = "۰:۰۰";
  loop();
}

function stopRec() {
  if (!mr || mr.state === "inactive") return;
  try { mr.stop(); } catch {}
}

function loop() {
  if (!mr || mr.state !== "recording") return;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const db = 20 * Math.log10(Math.sqrt(sum / buf.length) || 1e-7);
  const now = performance.now();
  if (now - lastLevelAt > 25) {
    levels.push(db);
    lastLevelAt = now;
    if (levels.length > 240) levels.shift();
    drawWave();
  }
  meter(db);
  const t = (now - recStart) / 1000;
  $("#clock").textContent = fmt(t);
  if (db > CFG.threshold + 8) { spoke = true; silentAt = 0; }
  else if (spoke && !silentAt) silentAt = now;
  if (spoke && silentAt && now - silentAt > CFG.silence && t > 0.5) return stopRec();
  if (t >= 30) return stopRec();
  raf = requestAnimationFrame(loop);
}

function finishRec() {
  cancelAnimationFrame(raf);
  document.body.classList.remove("rec");
  const type = (chunks[0] && chunks[0].type) || "audio/webm";
  const blob = new Blob(chunks, { type });
  const dur = (performance.now() - recStart) / 1000;
  const it = recTarget;
  mr = null;
  meter(-60);
  if (!blob.size || dur < 0.3 || !it) { status("چیزی ضبط نشد — دوباره.", true); idle(); return; }
  if (take?.url) URL.revokeObjectURL(take.url);
  take = { blob, url: URL.createObjectURL(blob), dur, hash: it.hash, path: it.path, i: it.i };
  PENDING.add(it.hash);
  $("#clock").textContent = fmt(dur);
  $("#takeInfo").textContent = `${fmt(dur)} · ${size(blob.size)} · ذخیره…`;
  saveTake(take);
  if (it.path === path) {
    if (CFG.autoplay) playTake().finally(() => { if (take && take.path === it.path && take.hash === it.hash && !document.body.classList.contains("rec")) scheduleAdvance(450); });
    else scheduleAdvance(250);
  }
  idle();
}

function idle() {
  document.body.classList.remove("rec");
  $("#recBtn").textContent = "●";
  const it = ITEMS[cur];
  $("#hint").textContent = it && DONE.has(it.hash) ? (TOUCH ? "دوباره را بزن تا جایگزین شود" : "R برای ضبط دوباره · Space برای همین جمله") : HINT_IDLE;
}

function scheduleAdvance(ms) {
  clearTimeout(advTimer);
  advTimer = setTimeout(() => { advTimer = 0; advance(); }, ms);
}

async function saveTake(tk) {
  const key = tk.path + "/" + tk.hash;
  const had = DONE.has(tk.hash);
  DONE.add(tk.hash);
  if (!had && tk.path === path) {
    COUNTS[tk.path] = (COUNTS[tk.path] || 0) + 1;
    updateCounts();
  }
  paintChips();
  try { await idbPut(key, { d: tk.path, h: tk.hash, blob: tk.blob, dur: tk.dur, at: Date.now() }); } catch {}
  upload(key);
}

const uploading = new Set();
async function upload(key) {
  if (uploading.has(key)) return;
  uploading.add(key);
  const rec = await idbGet(key).catch(() => null);
  if (!rec) { uploading.delete(key); return; }
  try {
    const res = await fetch("../api/audio?d=" + enc(rec.d) + "&h=" + rec.h, {
      method: "POST", headers: { "Content-Type": rec.blob.type || "application/octet-stream" }, body: rec.blob,
    });
    if (!res.ok) throw new Error((await res.text().catch(() => "")) || res.status);
    const j = await res.json();
    CLIPS[rec.h] = j.mtime || Date.now();
    PENDING.delete(rec.h);
    await idbDel(key);
    if (rec.d === path) paintChips();
    if (rec.d === path && take && take.hash === rec.h) $("#takeInfo").textContent = `${fmt(j.dur || take.dur)} · ${size(j.bytes || 0)} · ذخیره شد ✓`;
    if (rec.d === path && ITEMS[cur]?.hash === rec.h) $("#playBtn").disabled = false;
  } catch {
    if (rec.d === path && take && take.hash === rec.h) $("#takeInfo").textContent = "روی دستگاه ذخیره شد — ارسال در پس‌زمینه";
    setTimeout(() => { uploading.delete(key); upload(key); }, 10000);
    pending();
    return;
  } finally {
    uploading.delete(key);
  }
  pending();
}

async function retryPending() {
  try {
    for (const k of await idbKeys()) upload(k);
  } catch {}
  pending();
}

async function pending() {
  try {
    const n = (await idbKeys()).length;
    $("#sideHead").title = n ? `${faNum(n)} ضبط در انتظار ارسال` : "";
    if (n) status(`${faNum(n)} ضبط هنوز به سرور نرسیده — در پس‌زمینه تلاش می‌کنم.`);
  } catch {}
}

/* ── playback ──────────────────────────────────────────────────────────── */
function stopPlay() {
  playToken++;
  if (playEl) { try { playEl.pause(); } catch {} playEl = null; }
}

function playUrl(src) {
  stopPlay();
  const a = playEl = new Audio(src);
  const token = playToken;
  return new Promise((res) => {
    const done = () => { if (token === playToken && playEl === a) playEl = null; res(); };
    a.addEventListener("ended", done, { once: true });
    a.addEventListener("error", done, { once: true });
    a.play().catch(done);
  });
}

function playTake() {
  return take?.url ? playUrl(take.url) : Promise.resolve();
}

async function playCurrent() {
  const it = ITEMS[cur];
  if (!it) return;
  if (take && take.path === path && take.hash === it.hash && take.url) return playTake();
  const v = CLIPS[it.hash];
  if (v) return playUrl(`../audio/${path}/${it.hash}.m4a?v=${v}`);
  if (PENDING.has(it.hash)) {            // recorded here, not uploaded yet: play the local copy
    const rec = await idbGet(path + "/" + it.hash).catch(() => null);
    if (rec?.blob) return playUrl(URL.createObjectURL(rec.blob));
  }
}

let allToken = 0;
async function playAll() {
  const token = ++allToken;
  for (const it of ITEMS) {
    if (token !== allToken) return;
    const v = CLIPS[it.hash];
    if (!v) continue;
    go(it.i);
    await playUrl(`../audio/${path}/${it.hash}.m4a?v=${v}`);
  }
  if (token === allToken) status("پایان پخش.");
}

/* ── calibration: set the silence gate from the room ───────────────────── */
async function calibrate() {
  if (mr) return;
  try { await ensureMic(); } catch (e) { status(micError(e), true); return; }
  status("سه ثانیه سکوت کن…");
  const vals = [];
  const t0 = performance.now();
  await new Promise((res) => {
    (function f() {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) sum += v * v;
      vals.push(20 * Math.log10(Math.sqrt(sum / buf.length) || 1e-7));
      if (performance.now() - t0 < 3000) requestAnimationFrame(f); else res();
    })();
  });
  vals.sort((a, b) => a - b);
  const floor = vals[Math.floor(vals.length / 2)];
  CFG.threshold = Math.max(-55, Math.min(-30, Math.round(floor + 12)));
  store.set("threshold", CFG.threshold);
  $("#threshold").value = String(CFG.threshold);
  $("#thVal").textContent = faNum(CFG.threshold) + " dB";
  status("حساسیت تنظیم شد: " + faNum(CFG.threshold) + " dB");
}

/* ── bits ──────────────────────────────────────────────────────────────── */
function status(msg, err) {
  const el = $("#status");
  el.textContent = msg || "";
  el.classList.toggle("err", !!err);
  clearTimeout(statusTimer);
  if (msg && !err) statusTimer = setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 7000);
}

function meter(db) {
  const pct = Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
  const el = $("#meter");
  el.style.width = pct + "%";
  el.classList.toggle("hot", db > -3);
}

function drawWave() {
  const c = $("#wave"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = "#E5E3DA";
  g.fillRect(0, c.height / 2 - 1, c.width, 2);
  const step = c.width / 240;
  levels.forEach((db, i) => {
    const h = Math.max(2, ((Math.max(-60, Math.min(0, db)) + 60) / 60) * c.height * .92);
    g.fillStyle = "#D97757";
    g.fillRect(i * step, (c.height - h) / 2, Math.max(1, step * .62), h);
  });
}

/* ── events ────────────────────────────────────────────────────────────── */
function bind() {
  $("#menuBtn").addEventListener("click", () => openSide(!document.body.classList.contains("side-open")));
  $("#backdrop").addEventListener("click", () => openSide(false));
  $("#groups").addEventListener("click", (e) => {
    const b = e.target.closest(".ex");
    if (b) select(b.dataset.id);
  });
  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    stopPlay(); clearTimeout(advTimer); go(+b.dataset.i);
  });
  $("#recBtn").addEventListener("click", () => (mr ? stopRec() : startRec()));
  $("#redoBtn").addEventListener("click", () => { clearTimeout(advTimer); startRec(); });
  $("#skipBtn").addEventListener("click", () => { clearTimeout(advTimer); go(cur + 1); });
  $("#playBtn").addEventListener("click", () => playCurrent());
  $("#allBtn").addEventListener("click", () => playAll());
  $("#calibBtn").addEventListener("click", calibrate);

  $("#autoPlay").addEventListener("change", (e) => { CFG.autoplay = e.target.checked; store.set("autoplay", CFG.autoplay); });
  $("#enChk").addEventListener("change", (e) => { CFG.showEn = e.target.checked; store.set("showEn", CFG.showEn); $("#en").hidden = !CFG.showEn; });
  $("#silence").addEventListener("change", (e) => { CFG.silence = +e.target.value; store.set("silence", CFG.silence); });
  $("#threshold").addEventListener("input", (e) => {
    CFG.threshold = +e.target.value;
    $("#thVal").textContent = faNum(CFG.threshold) + " dB";
    store.set("threshold", CFG.threshold);
  });
  $("#micSel").addEventListener("change", (e) => {
    CFG.mic = e.target.value;
    store.set("mic", CFG.mic);
    closeMic();
    status("میکروفون عوض شد — با اولین ضبط باز می‌شود.");
  });

  window.addEventListener("keydown", (e) => {
    const box = e.target.matches?.("input, select, textarea");
    if (box) return;
    const k = e.key;
    if (k === " " || k === "Enter") {
      e.preventDefault();
      document.activeElement?.blur?.();
      if (mr) stopRec(); else { clearTimeout(advTimer); startRec(); }
    } else if (k === "r" || k === "R") {
      e.preventDefault(); clearTimeout(advTimer); startRec();
    } else if (k === "p" || k === "P") {
      e.preventDefault(); stopPlay(); playCurrent();
    } else if (k === "s" || k === "S") {
      e.preventDefault(); clearTimeout(advTimer); go(cur + 1);
    } else if (k === "f" || k === "F") {
      e.preventDefault();
      const it = ITEMS[cur];
      if (!it) return;
      FLAGS.has(it.hash) ? FLAGS.delete(it.hash) : FLAGS.add(it.hash);
      store.set("flags." + path, [...FLAGS]);
      paintChips();
    } else if (k === "Backspace") {
      e.preventDefault(); stopPlay(); clearTimeout(advTimer); go(cur - 1);
    } else if (k === "ArrowLeft") {
      e.preventDefault(); stopPlay(); clearTimeout(advTimer); go(cur + 1);
    } else if (k === "ArrowRight") {
      e.preventDefault(); stopPlay(); clearTimeout(advTimer); go(cur - 1);
    } else if (k === "Escape") {
      clearTimeout(advTimer); stopPlay(); openSide(false);
    }
  });

  window.addEventListener("online", retryPending);
  document.addEventListener("visibilitychange", () => { if (document.hidden) { if (mr) stopRec(); closeMic(); } else retryPending(); });
  window.addEventListener("beforeunload", (e) => {
    if (mr) { e.preventDefault(); e.returnValue = ""; }
  });
}
</script>
</body>
</html>
